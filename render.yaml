services:
  - type: web
    name: sunday-bakery
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PAYMENT_MODE
        value: demo
      - key: PUBLIC_BASE_URL
        sync: false
